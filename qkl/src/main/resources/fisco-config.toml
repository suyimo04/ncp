[cryptoMaterial]
# SSL证书路径，相对于 resources 目录
certPath = "conf"
# 是否使用国密算法，普通模式填 false
useSMCrypto = "false"

[network]
# 消息超时（毫秒）
messageTimeout = 10000
# 默认群组
defaultGroup = "group1"
# FISCO BCOS 节点连接地址
# TODO: 替换为实际的节点IP和端口
peers = ["192.168.217.128:20200"]

[account]
# 密钥存储目录
keyStoreDir = "account"
# 指定账户地址（留空则使用 yml 配置的私钥或自动生成）
accountAddress = ""
# 密钥文件格式
accountFileFormat = "pem"
# 密钥文件密码
password = ""

[threadPool]
# SDK 线程池大小
threadPoolSize = 16
